<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YouTube Clip Maker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 650px;
            background: #1f2937;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #9ca3af;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #4b5563;
            border-radius: 8px;
            background: #111827;
            color: white;
            font-size: 15px;
        }

        .time-row {
            display: flex;
            gap: 15px;
        }

        .time-row > div {
            flex: 1;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 8px;
            background: #ef4444;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #dc2626;
        }

        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            color: #d1d5db;
        }

        .example {
            margin-top: 20px;
            padding: 15px;
            background: #111827;
            border-radius: 8px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎬 YouTube Clip Maker</h1>

    <div class="subtitle">
        Download a selected portion of your video
    </div>

    <form id="downloadForm" action="/download" method="POST">

        <label>YouTube Video URL</label>

        <input
            type="url"
            name="url"
            placeholder="https://www.youtube.com/watch?v=..."
            required
        >

        <div class="time-row">

            <div>
                <label>Start Time</label>

                <input
                    type="text"
                    name="start"
                    placeholder="01:20:00"
                    required
                >
            </div>

            <div>
                <label>End Time</label>

                <input
                    type="text"
                    name="end"
                    placeholder="01:35:00"
                    required
                >
            </div>

        </div>

        <label>Video Quality</label>

        <select name="quality">
            <option value="1080">1080p HD</option>
            <option value="720">720p HD</option>
        </select>

        <button type="submit" id="downloadBtn">
            ⬇️ Download Clip
        </button>

    </form>

    <div id="status"></div>

    <div class="example">
        <b>Example:</b><br><br>

        3-hour video<br>
        Start: <b>01:20:00</b><br>
        End: <b>01:35:00</b><br><br>

        Output: <b>15-minute MP4 clip</b>
    </div>

</div>

<script>
    const form = document.getElementById("downloadForm");
    const button = document.getElementById("downloadBtn");
    const status = document.getElementById("status");

    form.addEventListener("submit", function () {
        button.disabled = true;
        button.innerText = "⏳ Processing...";
        status.innerText = "Your clip is being prepared. Please wait...";
    });
</script>

</body>
</html>
